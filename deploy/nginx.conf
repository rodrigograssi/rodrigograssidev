# Site estático do rodrigograssi.dev.
# O HTTPS termina no Traefik; aqui o Nginx só recebe HTTP na porta 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Redirecionamentos relativos (ex.: /paiol -> /paiol/), sem expor http:// nem a porta 8080
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain;

    error_page 404 /404.html;

    # Verificação de saúde do container (HEALTHCHECK do Dockerfile)
    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos do build com hash no nome: nunca mudam, cache de 1 ano
    location /_astro/ {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Ícones, imagem OG e robots: cache de 1 dia
    location ~* \.(?:ico|png|svg|txt|xml)$ {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Páginas HTML: sempre revalidar, para um deploy novo aparecer na hora
    location / {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
