# Cabeçalhos de segurança, incluídos em cada location.
# (No Nginx, um add_header dentro de location descarta os do nível de server; por isso o include.)

# O .dev já está na lista de pré-carregamento HSTS; o cabeçalho reforça para os navegadores
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 'unsafe-inline': o Astro coloca o CSS no HTML e o menu mobile é um script inline
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
